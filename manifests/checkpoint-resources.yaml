apiVersion: gpu-cr.io/v1alpha1
kind: GPUCheckpoint
metadata:
  name: hami-pod-a-checkpoint
  namespace: hami-selective-cr
  labels:
    app.kubernetes.io/name: hami-selective-cr
spec:
  workloadRef:
    kind: Pod
    namespace: hami-selective-cr
    name: hami-pod-a
    container: selective-target
  storage:
    type: ${CHECKPOINT_STORAGE_TYPE}
    path: ${CHECKPOINT_STORAGE_PATH}
