apiVersion: v1
kind: Pod
metadata:
  name: hami-pod-a
  namespace: hami-selective-cr
  labels:
    app.kubernetes.io/name: hami-selective-cr
    experiment.gpu-cr/role: selective-target
  annotations:
    experiment.gpu-cr/checkpoint-target: "true"
spec:
  schedulerName: hami-scheduler
  restartPolicy: Never
  serviceAccountName: hami-selective-cr-runner
  containers:
    - name: selective-target
      image: ${WORKLOAD_BASE_IMAGE}
      imagePullPolicy: IfNotPresent
      command: ["/bin/bash", "-lc"]
      args:
        - |
          set -Eeuo pipefail
          nvcc -O2 -cudart shared -o /tmp/selective-target /workspace-src/main.cu
          ldd /tmp/selective-target | grep -E 'libcudart|libcuda' || true
          exec /tmp/selective-target
      env:
        - name: WORKLOAD_ID
          value: pod-a
        - name: CHECKPOINT_MARKER_PATH
          value: /tmp/hami-selective-target.marker
        - name: GCR_VMM_ALLOC
          value: "1"
        - name: LD_PRELOAD
          value: /opt/gpu-cr/libgcr-interceptor.so
        - name: GCR_HOME
          value: /opt/gpu-cr
        - name: GCR_POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        - name: GCR_CONTROL_DIR
          value: /var/lib/gpu-cr/run
        - name: GCR_DATA_DIR
          value: ${GCR_DATA_DIR}
      volumeMounts:
        - name: workload-source
          mountPath: /workspace-src
          readOnly: true
        - name: gpu-cr-lib
          mountPath: /opt/gpu-cr
          readOnly: true
        - name: gpu-cr-run
          mountPath: /var/lib/gpu-cr/run
        - name: gcr-checkpoint
          mountPath: /var/lib/gcr-checkpoint
        - name: gcr-data
          mountPath: /var/lib/gcr-data
      resources:
        limits:
          nvidia.com/gpu: "1"
          nvidia.com/gpumem: "${POD_A_MEMORY_MB}"
          nvidia.com/gpucores: "${POD_A_CORE_PERCENT}"
  volumes:
    - name: workload-source
      configMap:
        name: hami-pod-a-source
    - name: gpu-cr-lib
      hostPath:
        path: ${GPU_CR_LIB_HOST_PATH}
        type: Directory
    - name: gpu-cr-run
      hostPath:
        path: ${GCR_CONTROL_DIR}
        type: DirectoryOrCreate
    - name: gcr-checkpoint
      hostPath:
        path: ${CHECKPOINT_STORAGE_PATH}
        type: DirectoryOrCreate
    - name: gcr-data
      hostPath:
        path: ${GCR_DATA_DIR}
        type: DirectoryOrCreate
