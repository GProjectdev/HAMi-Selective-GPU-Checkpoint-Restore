apiVersion: v1
kind: Pod
metadata:
  name: ${INTERFERENCE_POD_NAME}
  namespace: ${EXPERIMENT_NAMESPACE}
  labels:
    app.kubernetes.io/name: hami-selective-cr
    experiment.gpu-cr/role: shared-gpu-interference
    experiment.gpu-cr/group: ${INTERFERENCE_GROUP}
    experiment.gpu-cr/worker: ${INTERFERENCE_WORKER}
    experiment.gpu-cr/model: ${INTERFERENCE_MODEL_SAFE_NAME}
  annotations:
    experiment.gpu-cr/checkpoint-target: "true"
spec:
  schedulerName: hami-scheduler
  restartPolicy: Never
  serviceAccountName: hami-selective-cr-runner
  nodeSelector:
    kubernetes.io/hostname: ${INTERFERENCE_NODE}
  containers:
    - name: inference
      image: ${INFERENCE_IMAGE}
      imagePullPolicy: IfNotPresent
      command: ["/bin/bash", "-lc"]
      args:
        - |
          set -Eeuo pipefail
          if [ "${INFERENCE_PIP_INSTALL}" = "true" ]; then
            python -m pip install --no-cache-dir ${INFERENCE_PIP_PACKAGES}
          fi
          cat >/tmp/hami_shared_inference_loop.py <<'PY'
          import os
          import time
          import torch
          from transformers import AutoModelForCausalLM, AutoTokenizer

          pod = os.environ.get("POD_NAME", "unknown")
          worker = os.environ.get("INTERFERENCE_WORKER", "unknown")
          model_id = os.environ["INFERENCE_MODEL_ID"]
          model_path = os.environ["INFERENCE_MODEL_PATH"]
          prompt = os.environ.get("INFERENCE_PROMPT", "Shared GPU checkpoint interference validation")
          max_new_tokens = int(os.environ.get("INFERENCE_MAX_NEW_TOKENS", "24"))
          sleep_s = float(os.environ.get("INFERENCE_SLEEP_SECONDS", "0.2"))

          print(f"[interference] loading pod={pod} worker={worker} model={model_id} path={model_path}", flush=True)
          tokenizer = AutoTokenizer.from_pretrained(model_path, local_files_only=True)
          if tokenizer.pad_token is None and tokenizer.eos_token is not None:
            tokenizer.pad_token = tokenizer.eos_token
          model = AutoModelForCausalLM.from_pretrained(
              model_path,
              local_files_only=True,
              torch_dtype=torch.float16,
          ).to("cuda")
          model.eval()
          inputs = tokenizer(prompt, return_tensors="pt").to("cuda")
          torch.cuda.synchronize()
          open("/tmp/hami_interference_ready", "w").write(str(time.time()) + "\n")
          print(f"[interference] ready pod={pod} worker={worker}", flush=True)

          iteration = 0
          with torch.inference_mode():
            while True:
              started = time.time()
              outputs = model.generate(
                  **inputs,
                  max_new_tokens=max_new_tokens,
                  do_sample=False,
                  pad_token_id=tokenizer.pad_token_id,
              )
              torch.cuda.synchronize()
              elapsed = time.time() - started
              allocated = torch.cuda.memory_allocated() // (1024 * 1024)
              reserved = torch.cuda.memory_reserved() // (1024 * 1024)
              print(
                  f"[interference] ts={time.time():.6f} pod={pod} worker={worker} "
                  f"model={model_id} iteration={iteration} latency_s={elapsed:.6f} "
                  f"ips={(1.0 / elapsed if elapsed > 0 else 0.0):.6f} "
                  f"cuda_allocated_mb={allocated} cuda_reserved_mb={reserved} tokens={outputs.shape[-1]}",
                  flush=True,
              )
              iteration += 1
              time.sleep(sleep_s)
          PY
          export LD_PRELOAD=/opt/gpu-cr/libgcr-interceptor.so
          exec python /tmp/hami_shared_inference_loop.py
      env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: INTERFERENCE_WORKER
          value: ${INTERFERENCE_WORKER}
        - name: INFERENCE_MODEL_ID
          value: ${INFERENCE_MODEL_ID}
        - name: INFERENCE_MODEL_PATH
          value: /models/${INFERENCE_MODEL_RELATIVE_PATH}
        - name: INFERENCE_PIP_INSTALL
          value: "${INFERENCE_PIP_INSTALL}"
        - name: INFERENCE_PIP_PACKAGES
          value: "${INFERENCE_PIP_PACKAGES}"
        - name: INFERENCE_MAX_NEW_TOKENS
          value: "${INFERENCE_MAX_NEW_TOKENS}"
        - name: INFERENCE_SLEEP_SECONDS
          value: "${INFERENCE_SLEEP_SECONDS}"
        - name: GCR_VMM_ALLOC
          value: "1"
        - name: GCR_HOME
          value: /opt/gpu-cr
        - name: GCR_POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        - name: GCR_CONTROL_DIR
          value: /var/lib/gpu-cr/run
        - name: GCR_DATA_DIR
          value: ${GCR_DATA_DIR}
        - name: GCR_REMOTE_SINK
          value: "${GCR_REMOTE_SINK}"
        - name: GCR_REMOTE_HOST
          value: "${GCR_REMOTE_HOST}"
        - name: GCR_REMOTE_PORT
          value: "${GCR_REMOTE_PORT}"
        - name: GCR_REMOTE_REQUIRED
          value: "${GCR_REMOTE_REQUIRED}"
      volumeMounts:
        - name: model-store
          mountPath: /models
          readOnly: true
        - name: gpu-cr-lib
          mountPath: /opt/gpu-cr
          readOnly: true
        - name: gpu-cr-run
          mountPath: /var/lib/gpu-cr/run
        - name: gcr-checkpoint
          mountPath: /var/lib/gcr-checkpoint
        - name: gcr-data
          mountPath: /var/lib/gcr-data
      resources:
        limits:
          nvidia.com/gpu: "1"
          nvidia.com/gpumem: "${INTERFERENCE_GPU_MEMORY_MB}"
          nvidia.com/gpucores: "${INTERFERENCE_GPU_CORE_PERCENT}"
  volumes:
    - name: model-store
      nfs:
        server: ${MODEL_NFS_SERVER}
        path: ${MODEL_NFS_EXPORT_PATH}/models
        readOnly: true
    - name: gpu-cr-lib
      hostPath:
        path: ${GPU_CR_LIB_HOST_PATH}
        type: Directory
    - name: gpu-cr-run
      hostPath:
        path: ${GCR_CONTROL_DIR}
        type: DirectoryOrCreate
    - name: gcr-checkpoint
      hostPath:
        path: ${CHECKPOINT_STORAGE_PATH}
        type: DirectoryOrCreate
    - name: gcr-data
      hostPath:
        path: ${GCR_DATA_DIR}
        type: DirectoryOrCreate
