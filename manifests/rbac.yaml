apiVersion: v1
kind: ServiceAccount
metadata:
  name: hami-selective-cr-runner
  namespace: hami-selective-cr
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hami-selective-cr-runner
  namespace: hami-selective-cr
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events", "configmaps"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  - apiGroups: ["gpu-cr.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hami-selective-cr-runner
  namespace: hami-selective-cr
subjects:
  - kind: ServiceAccount
    name: hami-selective-cr-runner
    namespace: hami-selective-cr
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: hami-selective-cr-runner
